<!DOCTYPE html>
<html lang="mn">
{% load static %}
{% load crispy_forms_tags %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нууц үгээ мартсан уу? - ММО</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'fontawesome/css/all.css' %}"/>
    <link rel="shortcut icon" href="{% static 'logo.png' %}">
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
</head>
<body class="d-flex flex-column min-vh-100">
{% csrf_token %}

<main class="flex-grow-1 d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card shadow-lg border-0 m-3" style="max-width: 480px; width: 100%; border-radius: 1rem;">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <a href="{% url 'posts:home' %}"><img src="{% static 'logo.png' %}" alt="logo" style="width: 60px;" class="img-fluid my-2"></a>
                <i class="fas fa-envelope text-primary d-block mt-2" style="font-size: 2.2rem;"></i>
                <h4 class="fw-bold mt-2">Нууц үгээ мартсан уу?</h4>
                <p class="text-muted mb-0">Бүртгэлтэй имэйл хаягаа оруулна уу. Нууц үг сэргээх холбоос таны имэйл рүү илгээгдэнэ.</p>
            </div>

            <form method="POST" novalidate>
                {% csrf_token %}
                {{ form|crispy }}

                <div class="d-grid mt-3">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="fas fa-paper-plane me-1"></i> Илгээх
                    </button>
                </div>
            </form>

            <hr class="my-4">
            <div class="text-center">
                <a href="{% url 'user_login' %}" class="btn btn-outline-secondary btn-sm">Буцах</a>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
