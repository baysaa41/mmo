<!DOCTYPE html>
<html lang="mn">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нууц үг солигдлоо - ММО</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'fontawesome/css/all.css' %}"/>
    <link rel="shortcut icon" href="{% static 'logo.png' %}">
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
</head>
<body class="d-flex flex-column min-vh-100">
{% csrf_token %}

<main class="flex-grow-1 d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card shadow-lg border-0 text-center p-5 m-3" style="max-width: 480px;">
        <div class="card-body">
            <div class="mb-3 text-success">
                <i class="fas fa-check-circle" style="font-size: 3rem;"></i>
            </div>
            <h4 class="fw-bold mb-3">Таны нууц үг амжилттай солигдлоо</h4>
            <p class="text-muted mb-4">Одоо шинэ нууц үгээрээ системд нэвтэрч болно.</p>
            <a href="{% url 'user_login' %}" class="btn btn-primary">Нэвтрэх</a>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
